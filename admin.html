<style>
/* ══════════════════════════════════════════════════════════
   Dori Yums — atelier (owner admin) · same tokens as the site (Maison)
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#FBF4E4; --bg-2:#F5EBD1; --card:#FFFAEC;
  --accent:#E0959E; --accent-soft:#F2C2C9; --accent-deep:#9C5666;
  --ink:#3A1F1F; --ink-strong:#1F0E12; --muted:#7A5C5C; --faint:#9C7B7B;
  --line:rgba(224,149,158,.45); --line-soft:rgba(224,149,158,.24);
  --gilt:linear-gradient(135deg,#5d3b2c 0%,#8e6342 12%,#d9b89a 24%,#f1d7c1 31%,#c89479 42%,#7d4e34 55%,#b88762 68%,#ead0b6 80%,#6b3f2a 100%);
  --mat:linear-gradient(135deg,#FFFAEC,#FAEFD2 60%,#EFE0B8);
  --shadow:0 10px 30px rgba(156,86,102,.12);
  --danger:#B0304A; --ok:#46703F;
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Inter', system-ui, sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --top-h:62px; --tab-h:66px; --side-w:236px;
}
html[lang="ar"]{--serif:'Amiri','Cormorant Garamond',serif;--sans:'Tajawal','Inter',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);
  background:radial-gradient(circle at 50% 0%, #FFF8E6 0%, #FAF3E0 55%, #F0E4C6 100%) fixed;
}
[hidden]{display:none !important}
button, input, select, textarea{font:inherit;color:inherit}
h1, h2, h3{font-family:var(--serif);font-weight:600;color:var(--ink-strong);margin:0;line-height:1.15}
p{margin:0}
img{max-width:100%;display:block}
a{color:var(--accent-deep)}
::selection{background:rgba(224,149,158,.3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── controls ── */
.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border-radius:999px;border:1px solid transparent;padding:10px 18px;font-size:.9rem;font-weight:500;letter-spacing:.01em;
  text-decoration:none;transition:all .25s var(--ease);white-space:nowrap;
}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#FFFAEC}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-ghost{background:rgba(255,250,236,.6);border-color:rgba(156,86,102,.45);color:var(--accent-deep)}
.btn-ghost:hover{border-color:var(--accent);background:#FFFAEC}
.btn-danger{background:transparent;border-color:rgba(176,48,74,.45);color:var(--danger)}
.btn-danger:hover{background:rgba(176,48,74,.08)}
.btn-wa{background:#25D366;border-color:#25D366;color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{
  appearance:none;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:all .25s var(--ease);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.is-off{opacity:.55}
.icon-btn-sm{width:32px;height:32px}
.icon-btn-sm svg{width:15px;height:15px}
.field{display:grid;gap:6px}
.field > span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:500}
html[lang="ar"] .field > span{letter-spacing:0;font-size:.82rem}
.input, .select, .textarea{
  width:100%;background:#FFFAEC;border:1px solid rgba(156,86,102,.4);border-radius:10px;padding:10px 12px;
  outline:none;transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.input:focus, .select:focus, .textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,149,158,.22)}
.textarea{resize:vertical;min-height:72px;line-height:1.5}
.hint{font-size:.78rem;color:var(--faint)}
.err{color:var(--danger);font-size:.86rem}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#D8C8BD;transition:background .25s var(--ease)}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(58,31,31,.25);transition:transform .25s var(--ease)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{box-shadow:0 0 0 3px rgba(224,149,158,.4)}
.grid2{display:grid;gap:12px}
.grid3{display:grid;gap:12px}
@media (min-width: 640px){ .grid2{grid-template-columns:1fr 1fr} .grid3{grid-template-columns:repeat(3,1fr)} }
.stack{display:grid;gap:12px}

/* ── full-screen states (boot, login, denied, not configured) ── */
.screen-center{min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.frame{background:var(--gilt);padding:9px;border:1px solid #3e2418;box-shadow:0 26px 60px rgba(156,86,102,.24), inset 0 0 0 1px rgba(255,255,255,.28);width:min(440px,100%)}
.frame-mat{background:var(--mat);padding:34px 28px 30px;text-align:center}
.frame-mat .logo{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;box-shadow:0 10px 30px rgba(156,86,102,.28)}
.frame-mat h1{font-size:2rem}
.frame-mat .sub{color:var(--muted);margin-top:6px}
.frame-mat form{text-align:left;margin-top:22px;display:grid;gap:14px}
.frame-mat .steps{text-align:left;margin:18px 0 0;padding-left:18px;color:var(--ink);display:grid;gap:8px;font-size:.92rem}
.boot-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin:18px auto 0;animation:pulse 1.2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ── shell ── */
.topbar{
  position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:color-mix(in srgb, var(--bg) 90%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:50%;box-shadow:0 4px 12px rgba(156,86,102,.25)}
.brand b{font-family:var(--serif);font-size:1.3rem;color:var(--accent-deep);white-space:nowrap}
.brand small{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid var(--line-soft);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#C9A54A}
.live.is-live i{background:#4f9a5a;box-shadow:0 0 0 3px rgba(79,154,90,.18)}
.live.is-off i{background:#B9A9A9}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{appearance:none;border:0;background:transparent;padding:6px 10px;font-size:.72rem;font-weight:500;letter-spacing:.08em;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:#FFFAEC}
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--card) 94%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
}
.tab{appearance:none;border:0;background:none;position:relative;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent-deep)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:2px;background:var(--accent)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:.66rem;font-weight:600;display:grid;place-items:center}
.views{padding:18px 16px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom));max-width:1120px;margin:0 auto;width:100%}
@media (min-width: 900px){
  .shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:var(--top-h) auto;min-height:100vh}
  .topbar{grid-column:1 / -1}
  .tabs{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));display:flex;flex-direction:column;gap:4px;
    padding:20px 12px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;border-right:1px solid var(--line-soft)}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:.93rem}
  .tab[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow)}
  .tab[aria-selected="true"]::before{display:none}
  .badge{position:static;margin-left:auto}
  .views{padding:28px 32px 56px}
}
@media (max-width: 560px){
  .brand small, .live span{display:none}
  .live{padding:8px}
}

/* ── views ── */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:clamp(1.8rem,4.5vw,2.3rem)}
.eyebrow{display:block;font-family:var(--serif);font-style:italic;color:var(--accent-deep);font-size:1.02rem}
html[lang="ar"] .eyebrow{font-style:normal}
.notice{padding:11px 14px;border-radius:12px;background:rgba(224,149,158,.16);border:1px solid rgba(156,86,102,.35);color:#7a3a48;font-size:.88rem;margin-bottom:14px}
.notice-row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:rgba(255,250,236,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:rgba(255,250,236,.7);border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFAEC}
.chip b{font-weight:600;margin-left:5px;opacity:.85}
.search{margin:10px 0 16px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.st-pending{background:#FCEFD6;color:#93600F}
.st-confirmed{background:#E3EBF4;color:#3D5D7E}
.st-baking{background:#F7DFE3;color:#934B5C}
.st-completed{background:#E1EEDC;color:#43693C}
.st-cancelled{background:#EEE7E2;color:#857474}

/* orders */
.olist{display:grid;gap:12px}
@media (min-width: 720px){ .olist{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))} }
.ocard{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 12px;display:grid;gap:10px;transition:box-shadow .3s var(--ease), border-color .3s var(--ease)}
.ocard.is-new{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,149,158,.28), var(--shadow)}
.ocard.is-cancelled{opacity:.7}
.ocard-open{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:grid;gap:5px}
.ocard-top{display:flex;align-items:center;gap:8px}
.ocode{font-family:var(--serif);font-weight:700;font-size:1.22rem;color:var(--accent-deep);letter-spacing:.04em}
.ocard-top .pill{margin-left:auto}
.newtag{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#fff;background:var(--danger);border-radius:999px;padding:2px 8px}
.oname{font-weight:600;color:var(--ink-strong);font-size:1rem}
.ometa{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.ometa .late{color:var(--danger);font-weight:600}
.ometa .soon{color:var(--accent-deep);font-weight:600}
.oactions{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line-soft);padding-top:10px}
.oactions .btn-primary{margin-left:auto}

/* drawer */
.drawer-back{position:fixed;inset:0;z-index:40;background:rgba(58,31,31,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;justify-content:flex-end}
.drawer{position:relative;width:min(580px,100%);height:100%;overflow-y:auto;background:var(--mat);box-shadow:-20px 0 50px rgba(58,31,31,.25);padding:24px 22px 44px}
.drawer-close{position:absolute;top:14px;right:14px;background:#FFFAEC}
.drawer h3{font-size:1.9rem;padding-right:44px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.dsub{color:var(--muted);font-size:.86rem;margin-top:4px}
.dsec{margin-top:20px}
.dsec > h4{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 8px;font-weight:600}
html[lang="ar"] .dsec > h4{letter-spacing:0;font-size:.82rem}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px dashed rgba(156,86,102,.25);font-size:.92rem}
.drow b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.drow.total b{font-family:var(--serif);font-size:1.45rem;color:var(--accent-deep)}
.dline{font-size:.95rem}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.status-row{display:flex;flex-wrap:wrap;gap:8px}
.status-btn{appearance:none;border:1px solid var(--line);background:#FFFAEC;border-radius:999px;padding:8px 13px;font-size:.84rem;cursor:pointer;transition:all .2s var(--ease)}
.status-btn[aria-pressed="true"]{border-color:transparent;font-weight:600;box-shadow:0 0 0 2px rgba(156,86,102,.35)}
.inspo{display:block;border-radius:12px;overflow:hidden;border:1px solid rgba(62,36,24,.2);background:#fff}
.inspo img{width:100%;max-height:340px;object-fit:cover}
.history{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.86rem}
.history li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.form-actions .btn-danger{margin-right:auto}
.lang-block{border:1px solid var(--line-soft);border-radius:14px;padding:12px;display:grid;gap:10px;background:rgba(255,250,236,.55)}
.lang-block > b{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.photo-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-edit img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:1px solid rgba(62,36,24,.2);background:#fff}
.photo-edit.is-wide img{width:200px;height:auto;aspect-ratio:5.5/1.6;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
@media (max-width: 640px){
  .drawer-back{align-items:flex-end}
  .drawer{height:auto;max-height:94vh;border-radius:22px 22px 0 0;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
}

/* calendar */
.cal-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
.cal-grid{display:grid;gap:14px}
@media (min-width: 900px){ .cal-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.cal-card{padding:16px 18px}
.cal-card h3{font-size:1.4rem}
.cal-card.is-today{border-color:var(--accent)}
.cal-card.is-late{border-color:rgba(176,48,74,.5)}
.cal-sub{font-size:.82rem;color:var(--muted);margin:2px 0 8px}
.cal-total{padding:16px 18px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:5px 0}
.frow span{font-weight:500}
.frow b{font-family:var(--serif);font-size:1.2rem;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.frow .bar{grid-column:1 / -1;height:6px;border-radius:6px;background:rgba(156,86,102,.12);overflow:hidden}
.frow .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#F2C2C9,#E0959E 50%,#9C5666)}
.order-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.order-chip{appearance:none;border:1px solid var(--line);background:#FFFAEC;border-radius:999px;padding:4px 10px;font-size:.76rem;cursor:pointer}

/* flavors */
.flist{display:grid;gap:10px}
.fitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(156,86,102,.06)}
.fitem img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid rgba(62,36,24,.18);background:#fff}
.fitem.is-off img{filter:grayscale(.6);opacity:.75}
.fi-name{font-family:var(--serif);font-size:1.22rem;font-weight:600;color:var(--ink-strong);line-height:1.2}
.fi-name small{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:var(--accent-deep);margin-right:6px}
.fi-meta{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-actions{display:flex;align-items:center;gap:6px}
.fi-state{font-size:.74rem;color:var(--muted);min-width:72px;text-align:right}
@media (max-width: 560px){
  .fitem{grid-template-columns:48px minmax(0,1fr);row-gap:8px}
  .fitem img{width:48px;height:48px}
  .fi-actions{grid-column:1 / -1;justify-content:flex-end;border-top:1px dashed var(--line-soft);padding-top:8px}
  .fi-state{margin-right:auto;text-align:left}
}

/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gcard{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(156,86,102,.06)}
.gcard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff}
.gcard.is-testimonial img{aspect-ratio:5.5/2;object-fit:contain;padding:6px}
.gcard-body{padding:10px 12px 4px;font-size:.84rem;flex:1}
.gcard-body b{display:block;font-family:var(--serif);font-size:1.08rem;color:var(--ink-strong)}
.gcard-body span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard-actions{display:flex;gap:4px;padding:6px 8px 10px;justify-content:flex-end}

/* settings */
.scards{display:grid;gap:16px}
.scard{padding:18px}
.scard > h3{font-size:1.45rem}
.scard > .hint{margin:2px 0 14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width: 820px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
.stat{padding:14px 16px;border-radius:14px;background:#FFFAEC;border:1px solid var(--line-soft)}
.stat b{display:block;font-family:var(--serif);font-size:1.75rem;color:var(--accent-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .stat span{letter-spacing:0;font-size:.8rem}
.subhead{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin:18px 0 6px}
html[lang="ar"] .subhead{letter-spacing:0;font-size:.82rem}
.row-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:8px}
.promo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.promo-row b{font-family:var(--serif);font-size:1.15rem;letter-spacing:.06em}
.promo-row .hint{display:block}
.save-row{display:flex;justify-content:flex-end;margin-top:14px}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));z-index:60;display:grid;gap:8px;width:min(440px, calc(100% - 32px))}
.toast{background:#33191C;color:#FAF3E0;border-radius:12px;padding:11px 14px;box-shadow:0 14px 34px rgba(0,0,0,.25);font-size:.88rem;animation:toast-in .3s var(--ease)}
.toast.is-new{background:var(--accent-deep)}
.toast.is-err{background:var(--danger)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width: 900px){ .toasts{left:auto;right:24px;bottom:24px;transform:none} }
@media (prefers-reduced-motion: reduce){ .toast{animation:none} .boot-dot{animation:none} }

/* Arabic: layout stays LTR like the site, text blocks follow their own direction */
html[lang="ar"] :is(p, .hint, .notice, .empty, .ometa, .ometa > span, .fi-meta, .cal-sub, .toast, .dsub, .drow > span, .gcard-body span, .err, .oname, .stat span, .frow span, .subhead, .live span){unicode-bidi:plaintext}
</style>
</head>
<body>

<!-- boot -->
<section class="screen-center" id="scrBoot">
  <div style="text-align:center">
    <img src="assets/logo.webp" alt="" width="86" height="86" style="width:86px;height:86px;border-radius:50%;margin:0 auto" />
    <div class="boot-dot"></div>
  </div>
</section>

<!-- Supabase not configured yet -->
<section class="screen-center" id="scrNoConfig" hidden>
  <div class="frame"><div class="frame-mat">
    <img class="logo" src="assets/logo.webp" alt="Dori Yums" width="86" height="86" />
    <h1 data-i18n="cfg.title">Supabase n'est pas encore connecté</h1>
    <p class="sub" data-i18n="cfg.body"></p>
    <ol class="steps">
      <li data-i18n="cfg.s1"></li>
      <li data-i18n="cfg.s2"></li>
      <li data-i18n="cfg.s3"></li>
    </ol>
  </div></div>
</section>

<!-- could not reach the server (offline, slow network) -->
<section class="screen-center" id="scrOffline" hidden>
  <div class="frame"><div class="frame-mat">
    <img class="logo" src="assets/logo.webp" alt="Dori Yums" width="86" height="86" />
    <h1 data-i18n="off.title">Pas de connexion</h1>
    <p class="sub" data-i18n="off.body"></p>
    <button class="btn btn-primary" type="button" data-action="retry" style="margin-top:20px"><span data-i18n="off.retry">Réessayer</span></button>
  </div></div>
</section>

<!-- login -->
<section class="screen-center" id="scrLogin" hidden>
  <div class="frame"><div class="frame-mat">
    <img class="logo" src="assets/logo.webp" alt="Dori Yums" width="86" height="86" />
    <h1 data-i18n="login.title">Atelier Dori Yums</h1>
    <p class="sub" data-i18n="login.sub">Espace réservé à la maison.</p>
    <form id="loginForm" novalidate>
      <label class="field"><span data-i18n="login.email">E-mail</span>
        <input class="input" id="loginEmail" type="email" autocomplete="username" inputmode="email" required />
      </label>
      <label class="field"><span data-i18n="login.password">Mot de passe</span>
        <input class="input" id="loginPassword" type="password" autocomplete="current-password" required />
      </label>
      <p class="err" id="loginErr" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" id="loginBtn" type="submit"><span data-i18n="login.submit">Se connecter</span></button>
    </form>
    <div class="langs" style="margin:20px auto 0;width:max-content" role="group" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="ar" aria-pressed="false">AR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div></div>
</section>

<!-- signed in, but not the owner -->
<section class="screen-center" id="scrDenied" hidden>
  <div class="frame"><div class="frame-mat">
    <img class="logo" src="assets/logo.webp" alt="Dori Yums" width="86" height="86" />
    <h1 data-i18n="denied.title">Accès refusé</h1>
    <p class="sub" data-i18n="denied.body"></p>
    <button class="btn btn-ghost" type="button" data-action="logout" style="margin-top:20px"><span data-i18n="app.logout">Se déconnecter</span></button>
  </div></div>
</section>

<!-- the atelier -->
<div class="shell" id="scrMain" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.webp" alt="" width="36" height="36" />
      <b>Dori Yums</b>
      <small data-i18n="app.title">Atelier</small>
    </div>
    <div class="top-tools">
      <span class="live is-off" id="liveState"><i></i><span id="liveLabel"></span></span>
      <button class="icon-btn" type="button" id="soundBtn" data-action="toggle-sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <div class="langs" role="group" aria-label="Langue">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="ar" aria-pressed="false">AR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="icon-btn" type="button" data-action="logout" data-i18n-aria="app.logout" aria-label="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Atelier">
    <button class="tab" role="tab" type="button" data-tab="orders" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
      <span data-i18n="tab.orders">Commandes</span><b class="badge" id="badgeOrders" hidden></b>
    </button>
    <button class="tab" role="tab" type="button" data-tab="calendar" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
      <span data-i18n="tab.calendar">Fournées</span>
    </button>
    <button class="tab" role="tab" type="button" data-tab="flavors" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5c0-3.6 3.6-6 8-6s8 2.4 8 6"/><path d="M3.5 12.5h17"/><path d="M4 14.5c0 3.6 3.6 5 8 5s8-1.4 8-5"/></svg>
      <span data-i18n="tab.flavors">Parfums</span>
    </button>
    <button class="tab" role="tab" type="button" data-tab="gallery" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.8"/><path d="m21 15-5-5L5 21"/></svg>
      <span data-i18n="tab.gallery">Galerie</span>
    </button>
    <button class="tab" role="tab" type="button" data-tab="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></svg>
      <span data-i18n="tab.settings">Réglages</span>
    </button>
  </nav>

  <main class="views">
    <section class="view" id="view-orders"></section>
    <section class="view" id="view-calendar" hidden></section>
    <section class="view" id="view-flavors" hidden></section>
    <section class="view" id="view-gallery" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<!-- side panel: order details, flavor and gallery editors -->
<div class="drawer-back" id="drawer" hidden>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="icon-btn drawer-close" type="button" data-action="close-drawer" data-i18n-aria="app.close" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="drawerBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- bump ?v= (and admin-sw.js SHELL + VERSION) whenever these files change -->
<script src="js/dy-data.js?v=3"></script>
<script src="js/admin.js?v=2"></script>
</body>
</html>
